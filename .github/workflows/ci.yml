name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    # macos-26 gives Swift 6.3 (Xcode 26), the toolchain we build and ship the
    # DMG with. macos-15's Swift 6.1.2 hits SwiftPM PIF bug #7958 on the
    # multi-arch build (.swiftLanguageMode(.v5) -> unsupported SWIFT_VERSION),
    # which is fixed in 6.2+. Testing on an older toolchain than we ship was how
    # the universal-build step silently broke from #28 onward.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test
      - name: Build universal (arm64 + x86_64)
        run: swift build -c release --arch arm64 --arch x86_64
      - name: Assert app binary is universal
        run: |
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/iMirror"
          archs="$(lipo -archs "$BIN")"
          echo "archs: $archs"
          case "$archs" in
            *x86_64*arm64*|*arm64*x86_64*) echo "OK: universal" ;;
            *) echo "NOT universal: $archs" >&2; exit 1 ;;
          esac
