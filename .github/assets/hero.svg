<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" role="img" aria-labelledby="imirror-title imirror-desc">
  <title id="imirror-title">iMirror</title>
  <desc id="imirror-desc">Mirror and control a real iPhone from macOS while the phone stays live, with an agent-driven test rig that emits self-contained HTML reports.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A3799"/>
      <stop offset="0.5" stop-color="#241E45"/>
      <stop offset="1" stop-color="#121022"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.16" r="0.75">
      <stop offset="0" stop-color="#6A4FD0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6A4FD0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39CBEC"/>
      <stop offset="1" stop-color="#1C78EF"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F3FB"/>
      <stop offset="1" stop-color="#D7D2E8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#glow)"/>

  <g transform="translate(150,52)">
    <rect x="6" y="14" width="176" height="276" rx="30" fill="#000000" opacity="0.32"/>
    <rect x="0" y="0" width="176" height="276" rx="30" fill="url(#phone)"/>
    <rect x="14" y="14" width="148" height="248" rx="18" fill="url(#screen)"/>
    <path transform="translate(74,104)" d="M0 0 L0 44 L12 33 L20 51 L28 47 L20 30 L36 30 Z" fill="#ffffff" stroke="#0B1B44" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <circle cx="322" cy="66" r="30" fill="#0F0C1E"/>
  <circle cx="322" cy="66" r="21" fill="#30D158"/>

  <g transform="translate(372,150)">
    <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="98" font-weight="700" letter-spacing="-3" fill="#ffffff">iMirror</text>
    <text y="50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="500" fill="#CFC7EC">Mirror &amp; control a real iPhone from macOS &#8212; the phone stays live.</text>
    <g transform="translate(0,84)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600">
      <g>
        <rect x="0" y="0" width="196" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.20"/>
        <text x="98" y="26" text-anchor="middle" fill="#E9E4F8">View-only by default</text>
      </g>
      <g transform="translate(212,0)">
        <rect x="0" y="0" width="272" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.20"/>
        <text x="136" y="26" text-anchor="middle" fill="#E9E4F8">Agent test rig + HTML reports</text>
      </g>
      <g transform="translate(500,0)">
        <rect x="0" y="0" width="280" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.20"/>
        <text x="140" y="26" text-anchor="middle" fill="#E9E4F8">Notarized &#183; 0 third-party deps</text>
      </g>
    </g>
  </g>
</svg>
